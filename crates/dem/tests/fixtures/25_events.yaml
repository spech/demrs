    name: "Event00"
    calib:
      step_up: 1
      step_down: 1
      debounce_type: CounterBased
      debounce_behavior: Freeze
      confirmation_threshold: 1
      aging_threshold: 10
      priority: 1
      save_trigger: OnCdtc

