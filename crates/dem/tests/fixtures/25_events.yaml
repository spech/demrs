# 25-event fixture for testing ExtendedRecordList (capacity: 24)
# All events have uniform configuration for predictable testing:
# - debounce_type: CounterBased
# - debounce_behavior: Freeze
# - step_up/step_down: 1 (immediate)
# - confirmation_threshold: 1
# - aging_threshold: 10
# - priority: id + 1 (priority 1-25, event id matches index)

events:
