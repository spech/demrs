[package]
name = "dem"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
minijinja = { version = "2", features = ["loader"] }

[dependencies]
ordered_list = { path = "../ordered_list" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

